<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>영어 레벨 테스트 v2</title>
<style>
:root{--navy:#0d1526;--gold:#c79a3f;--ink:#20242e;--mut:#646a76;--line:#d9d5ca;--bg:#fbf9f4}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 -apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
header{background:var(--navy);color:#fff;padding:18px 16px}header b{color:var(--gold)}main{max-width:640px;margin:auto;padding:20px 16px 60px}
h2{font-size:21px;margin:.2em 0 .6em}.step{color:var(--mut);font-size:14px}.q{margin:18px 0}.q p{margin:0 0 6px;font-weight:600}
label{display:block;padding:9px 12px;border:1px solid var(--line);border-radius:8px;margin:5px 0;background:#fff;cursor:pointer}
button{background:var(--navy);color:#fff;border:0;border-radius:8px;padding:13px 20px;font:600 16px inherit;cursor:pointer;margin-top:12px}button:disabled{opacity:.45;cursor:default}
.res{font-size:30px;color:var(--navy);font-weight:800}.note{color:var(--mut);font-size:14px}table{border-collapse:collapse;width:100%;margin:12px 0}td{border-bottom:1px solid var(--line);padding:7px 4px}td:last-child{text-align:right;font-weight:600}[hidden]{display:none}
.send{margin-top:22px;padding:14px;border:1px solid var(--line);border-radius:10px;background:#fff}.send input{display:block;width:100%;padding:11px;margin:6px 0;border:1px solid var(--line);border-radius:8px;font:inherit}
</style></head><body><header><b>이기는 법</b> · 영어 듣기 레벨 테스트 (5분)</header><main id="m"></main>
<script src="문항.js"></script>
<script src="저장설정.js"></script>
<script>
const SELF=[["쉬운 영어 영상을 자막 없이 보면 어떤가요?",["거의 안 들려요","단어만 조금 들려요","내용은 대강 따라가요","대부분 알아들어요"]],
["영어 뉴스를 들으면 어떤가요?",["거의 안 들려요","단어만 조금 들려요","주제는 알아요","대부분 알아들어요"]],
["영어로 나를 소개할 수 있나요?",["이름 정도만요","외운 문장 몇 개는요","30초쯤은 돼요","1분 넘게 이어 갈 수 있어요"]],
["식당·호텔처럼 정해진 자리에서 영어로 말할 수 있나요?",["못 해요","단어로는 해요","짧은 문장으로 해요","예상 밖 질문에도 답해요"]],
["쉬운 영어 글 한 쪽을 읽으면 어떤가요?",["거의 모르겠어요","사전을 자주 찾아요","대강 이해해요","사전 없이 편하게 읽어요"]]];
const LEVELS=[[0,"왕초보",0],[3,"초보",3],[6,"중급",6],[9,"고급",10]];
function score(selfPts,right){let i=0;LEVELS.forEach((x,k)=>{if(right>=x[0])i=k});let note="";const nx=LEVELS[i+1];
if(nx&&nx[0]-right===1&&selfPts>=nx[2]){i++;note="up"}else if(i>0&&right===LEVELS[i][0]&&selfPts<LEVELS[i][2]-2){i--;note="down"}
return{right,selfPts,note,lv:LEVELS[i]}}
// 판: 첫날 = A, 재시험 = ?판=B / C / D (주소에 붙여 보냄). 모르는 값이면 A.
const FORM=(()=>{const q=new URLSearchParams(location.search).get("판")||new URLSearchParams(location.search).get("form")||"A";const k=q.toUpperCase();return FORMS[k]?k:"A"})();
const Q=FORMS[FORM],AUD=i=>(FORM==="A"?"음성/":"음성/"+FORM+"/")+"듣기"+(i+1)+".m4a";
const S={self:[],lis:[]},m=document.getElementById("m");
function radios(n,o){return o.map((x,i)=>`<label><input type="radio" name="${n}" value="${i}"> ${x}</label>`).join("")}
function start(){m.innerHTML=`<h2>5분이면 끝나요</h2><p>두 부분이에요. 지금 내 모습을 고르는 5문항, 짧은 영어를 듣고 뜻을 고르는 10문항. 타자는 칠 일이 없어요. 소리를 켜고 시작하세요. 음성은 한 번씩만 나와요.</p><p class="note">이 결과는 어디에서 시작할지 정하고, 다음에 다시 잴 때 비교하는 데만 써요.${FORM==="A"?"":" (다시 재기 "+FORM+"판)"}</p><button onclick="self1()">시작</button>`}
function self1(){m.innerHTML=`<div class="step">1/2 · 약 1분</div><h2>지금 내 모습에 가까운 쪽을 고르세요</h2>`+SELF.map((q,i)=>`<div class="q"><p>${i+1}. ${q[0]}</p>${radios("s"+i,q[1])}</div>`).join("")+`<button id="n">다음</button>`;
document.getElementById("n").onclick=()=>{const v=SELF.map((_,i)=>document.querySelector(`input[name=s${i}]:checked`));if(v.some(x=>!x))return alert("다섯 문항을 모두 골라 주세요.");S.self=v.map(x=>+x.value);lis1(0)}}
function lis1(i){if(i===Q.length)return done();const q=Q[i];m.innerHTML=`<div class="step">2/2 · 듣기 ${i+1}/${Q.length} · 뒤로 갈수록 어려워요</div><h2>${q.q}</h2><button id="p">음성 듣기</button><audio id="a" src="${AUD(i)}" preload="auto"></audio><div class="q">${radios("l",q.a.concat("잘 모르겠어요"))}</div><button id="n">다음</button>`;
const p=document.getElementById("p"),a=document.getElementById("a");a.onerror=()=>{p.textContent="음성을 틀지 못했어요. 「잘 모르겠어요」로 넘어가세요";p.disabled=true};p.onclick=()=>{p.disabled=true;a.play()};
document.getElementById("n").onclick=()=>{const v=document.querySelector("input[name=l]:checked");if(!v)return alert("하나를 골라 주세요. 모르면 「잘 모르겠어요」를 고르세요.");S.lis[i]=+v.value;lis1(i+1)}}
function save(r){const rec={date:new Date().toISOString().slice(0,10),form:FORM,listening:r.right,self:r.selfPts,level:r.lv[1]};try{const k="winning_level_test",h=JSON.parse(localStorage.getItem(k)||"[]");h.push(rec);localStorage.setItem(k,JSON.stringify(h));return h}catch(e){return[rec]}}
function done(){const r=score(S.self.reduce((a,b)=>a+b,0),S.lis.filter((v,i)=>v===Q[i].c).length),h=save(r),first=h[0];m.innerHTML=`<div class="step">결과</div><div class="res">${r.lv[1]}</div><p>여기부터 시작하면 돼요. 잘하고 못하고를 가르는 점수가 아니라, 어디서 시작할지 정하는 숫자예요.</p><table><tr><td>듣기 점수</td><td>${r.right} / 10</td></tr><tr><td>자기 진단</td><td>${r.selfPts} / 15</td></tr><tr><td>처음 본 날 듣기 점수</td><td>${first.listening} / 10 (${first.date})</td></tr></table><p class="note">기준선은 응시 데이터가 쌓이면 맞춰 가요.</p><div id="sb"></div>`;winSendBox(document.getElementById("sb"),()=>({kind:"듣기",form:FORM,listening:r.right,self:r.selfPts,level:r.lv[1]}))}
window.__t={score,LIS,Q,FORM,LEVELS,S,done};start();
</script></body></html>
